<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WUCO Executive Academy learning management system.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WUCO Executive Academy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>WUCO Executive Academy</title>
  <meta name="theme-color" content="#0A1E3D">
  <link rel="manifest" href="manifest.json">

  <!--
    Default social preview card.

    These cover a link to the site itself. A link to a particular event or
    programme should be shared through the API's /share/ endpoint instead,
    which serves that item's own title, description and artwork — a crawler
    fetching this page finds only the application shell, because the pages are
    painted in the browser. The Super Admin's "Share" controls already build
    the right URL.
  -->
  <meta property="og:site_name" content="WUCO Executive Academy">
  <meta property="og:type" content="website">
  <meta property="og:title" content="WUCO Executive Academy">
  <meta property="og:description" content="Africa's executive academy for leadership, trade, investment and professional development.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="WUCO Executive Academy">
  <meta name="twitter:description" content="Africa's executive academy for leadership, trade, investment and professional development.">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
