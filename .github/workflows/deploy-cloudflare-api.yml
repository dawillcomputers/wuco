name: Deploy Cloudflare API and D1

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-cloudflare-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply D1 migrations and deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare
    env:
      # Trailing whitespace in the secret produces a malformed Authorization
      # header (Cloudflare code 6111), so the value is trimmed before use.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Worker dependencies
        run: npm install

      - name: Type-check the Worker
        # Runs before anything is touched in Cloudflare, so a type error never
        # leaves a half-applied release.
        run: npm run typecheck

      - name: Verify Cloudflare credentials
        # Fails in seconds with a readable message rather than part-way through
        # a migration. `whoami` exercises the same auth path as deploy.
        run: |
          TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN}" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # The trimmed value differs from the registered secret, so it is not
          # masked automatically. Register it before it can reach a log.
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          if ! CLOUDFLARE_API_TOKEN="$TOKEN" npx wrangler whoami; then
            echo "::error::Cloudflare rejected the API token. Create an API Token (not a Global API Key) with Account: D1 Edit, Account: Workers Scripts Edit, User: Memberships Read, then re-add the secret with no surrounding whitespace."
            exit 1
          fi

      - name: Ensure the media bucket exists
        # `wrangler deploy` fails if a declared R2 binding has no bucket, so the
        # bucket is created first. Creation is idempotent in effect: an existing
        # bucket returns an error that is safe to ignore, and a genuine failure
        # (R2 not enabled on the account) surfaces in the deploy step with a
        # clearer message than a half-applied release.
        run: npx wrangler r2 bucket create wuco-media || echo "Bucket already exists or R2 is unavailable; continuing."

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply WEA_DB --remote

      - name: Deploy Worker API
        run: npx wrangler deploy
